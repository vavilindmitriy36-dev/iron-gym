<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IRON GYM — Фитнес-клуб</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ШАПКА -->
    <header class="header">
        <div class="container header__inner">

            <a href="#" class="logo">
                IRON<span>GYM</span>
            </a>

            <nav class="nav">
                <a href="#about">О клубе</a>
                <a href="#programs">Программы</a>
                <a href="#trainers">Тренеры</a>
                <a href="#pricing">Цены</a>
                <a href="#contacts">Контакты</a>
            </nav>

            <a href="#booking" class="header__button">
                Записаться
            </a>

        </div>
    </header>


    <!-- ПЕРВЫЙ ЭКРАН -->
    <main>

        <section class="hero">

            <div class="container hero__content">

                <p class="hero__subtitle">
                    ФИТНЕС-КЛУБ В УРАЛЬСКЕ
                </p>

                <h1>
                    СТАНЬ<br>
                    <span>СИЛЬНЕЕ</span>
                </h1>

                <p class="hero__text">
                    Современный зал, профессиональные тренеры
                    и тренировки, которые помогают достигать результата.
                </p>

                <div class="hero__buttons">
                    <a href="#booking" class="button button--primary">
                        Начать тренироваться
                    </a>

                    <a href="#programs" class="button button--secondary">
                        Наши программы
                    </a>
                </div>

            </div>

        </section>

    </main>


    <!-- ПОДВАЛ -->
    <footer class="footer">
        <p>© 2026 IRON GYM. Все права защищены.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
